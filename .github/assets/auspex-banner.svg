<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" font-family="'Syne','Space Grotesk',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="72%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#08160d"/>
      <stop offset="60%" stop-color="#05090c"/>
      <stop offset="100%" stop-color="#04070b"/>
    </radialGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34E08A"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <radialGradient id="earth" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#0f2a1b"/>
      <stop offset="55%" stop-color="#08160d"/>
      <stop offset="100%" stop-color="#04080a"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="76%" stop-color="rgba(52,224,138,0)"/>
      <stop offset="92%" stop-color="rgba(52,224,138,.45)"/>
      <stop offset="100%" stop-color="rgba(52,224,138,0)"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#cfe8d8">
    <circle cx="120" cy="60" r="1.1" opacity=".5"/><circle cx="300" cy="40" r="1" opacity=".35"/>
    <circle cx="540" cy="70" r="1.2" opacity=".5"/><circle cx="760" cy="46" r="1" opacity=".4"/>
    <circle cx="200" cy="270" r="1.1" opacity=".45"/><circle cx="440" cy="290" r="1" opacity=".35"/>
    <circle cx="660" cy="276" r="1.2" opacity=".4"/><circle cx="980" cy="300" r="1" opacity=".3"/>
    <circle cx="1180" cy="70" r="1.1" opacity=".4"/><circle cx="1230" cy="200" r="1" opacity=".35"/>
  </g>

  <!-- living earth -->
  <g transform="translate(1040,170)">
    <circle r="172" fill="url(#atmo)"/>
    <circle r="150" fill="url(#earth)" stroke="rgba(52,224,138,.5)" stroke-width="1.5"/>
    <g stroke="rgba(52,224,138,.16)" stroke-width="1" fill="none">
      <ellipse rx="150" ry="50"/><ellipse rx="150" ry="100"/><ellipse rx="50" ry="150"/><ellipse rx="100" ry="150"/>
    </g>
    <!-- faint land -->
    <g fill="#16361f" opacity=".8">
      <path d="M-70,-60 q40,-16 70,8 q18,26 -10,48 q-46,16 -74,-14 q-14,-26 14,-42z"/>
      <path d="M20,30 q40,-8 52,28 q6,40 -34,56 q-40,6 -52,-30 q-6,-44 34,-54z"/>
    </g>
    <!-- events: green (calm), amber (watch), red (peril), blue (breakthrough) -->
    <circle cx="-44" cy="-40" r="5" fill="#34E08A" filter="url(#soft)"/>
    <circle cx="36" cy="44" r="7" fill="#FF4D5E" filter="url(#soft)"/>
    <circle cx="36" cy="44" r="15" fill="none" stroke="#FF4D5E" stroke-width="1" opacity=".5"/>
    <circle cx="70" cy="-30" r="4.5" fill="#FB923C"/>
    <circle cx="-10" cy="70" r="4.5" fill="#5AC8FA"/>
    <!-- connection arc -->
    <path d="M-44,-40 Q20,-100 70,-30" fill="none" stroke="rgba(163,230,53,.7)" stroke-width="1.4"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="180" font-size="118" font-weight="800" letter-spacing="14" fill="url(#wm)">AUSPEX</text>
  <text x="90" y="224" font-size="20" font-weight="500" letter-spacing="11" fill="#8fb8a0" font-family="'IBM Plex Mono',ui-monospace,monospace">WATCHING OVER THE WORLD</text>
  <text x="90" y="262" font-size="15" letter-spacing="2" fill="#5e7268" font-family="'IBM Plex Mono',ui-monospace,monospace">a living instrument for the whole planet — its perils and its breakthroughs</text>
  <rect x="90" y="100" width="6" height="86" rx="3" fill="url(#wm)"/>
</svg>
